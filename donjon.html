<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Le donjon — Balade sonore, Crouy-sur-Ourcq</title>
<meta name="description" content="Balade sonore — Le donjon, Crouy-sur-Ourcq.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   BALADE SONORE · Crouy-sur-Ourcq — feuille de style commune
   Mobile-first. Blackletter pour les titres, mono pour le reste.
   N&B strict. Rythme vertical : LH = 24px, multiples de 8.
   Aucun filet décoratif — la hiérarchie tient par l'espace.
   ============================================================ */

:root{
  --ink:#0a0a0a;
  --bg:#ffffff;
  --dim:rgba(10,10,10,.45);
  --faint:rgba(10,10,10,.10);
  --black:'UnifrakturMaguntia', serif;
  --mono:'JetBrains Mono', ui-monospace, monospace;
  --lh:24px;
  --pad:20px;
  --player-h:76px;
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--mono);
  font-size:14px;line-height:var(--lh);
  font-feature-settings:"tnum" 1;
  -webkit-font-smoothing:antialiased;
  max-width:520px;margin:0 auto;
  min-height:100svh;
  padding:0 var(--pad) calc(var(--player-h) + 32px);
  -webkit-tap-highlight-color:transparent;
}
body.no-player{padding-bottom:calc(var(--lh)*2)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* ---------- header ---------- */
header{
  display:flex;justify-content:space-between;align-items:center;
  height:calc(var(--lh)*2.5);
  position:sticky;top:0;background:var(--bg);z-index:20;
}
.brand{font-family:var(--black);font-size:24px;line-height:1;white-space:nowrap;flex:0 0 auto}
.hmeta{
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  max-width:52%;text-align:right;padding-left:12px;
}

/* ---------- accueil ---------- */
.intro{padding-top:calc(var(--lh)*.5)}
.intro h1{
  font-family:var(--black);font-weight:400;
  font-size:clamp(46px,14vw,60px);line-height:1;
  margin-bottom:var(--lh);
}
.intro p{font-size:15px;line-height:1.55;max-width:34ch}
.intro p .d{color:var(--dim)}
.facts{
  margin-top:calc(var(--lh)*1.5);
  display:grid;grid-template-columns:1fr 1fr;row-gap:14px;
  font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
}
.facts div{display:flex;flex-direction:column;gap:4px}
.facts b{color:var(--ink);font-weight:400;font-size:15px;letter-spacing:0;text-transform:none}

.section-label{
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
  margin:calc(var(--lh)*2) 0 var(--lh);
}

/* ---------- capsules ---------- */
.chain{display:flex;flex-direction:column;gap:10px}
.cap{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;
  background:var(--ink);color:var(--bg);
  border-radius:999px;padding:16px 24px;min-height:66px;
  transition:transform .25s cubic-bezier(.2,.7,.2,1);
}
.cap:active{transform:scale(.985)}
.cap__n{font-size:11px;letter-spacing:.08em;opacity:.55}
.cap__t{font-family:var(--black);font-size:25px;line-height:1;display:block}
.cap__time{font-size:12px;opacity:.55;white-space:nowrap}
.link{height:10px;display:flex;justify-content:center;align-items:center}
.link::before{content:"";width:3px;height:3px;border-radius:50%;background:var(--dim)}

/* ---------- page d'un arrêt ----------
   Sur mobile, l'illustration ET le bouton play doivent TOUJOURS être
   visibles à l'écran, quelle que soit la hauteur de l'appareil —
   sans avoir à faire défiler. On utilise 100dvh (hauteur réelle du
   viewport, barre d'adresse comprise) et une colonne flex où c'est
   l'illustration qui s'adapte, jamais le bouton. */
html, body.stop-page{ height:100%; }
body.stop-page{
  display:flex; flex-direction:column;
  height:100dvh; max-height:100dvh;
  padding-bottom:0; overflow:hidden;
}
body.stop-page header{ flex:0 0 auto; }
body.stop-page main{
  flex:1 1 auto; min-height:0;
  display:flex; flex-direction:column;
  padding-bottom:calc(var(--lh)*1.25);
  overflow-y:auto; -webkit-overflow-scrolling:touch;
}
/* le duo image + bouton occupe TOUJOURS tout l'écran disponible au
   chargement ; si le texte du transcript s'ouvre et dépasse, c'est
   cette zone qui défile — jamais au détriment de l'image/bouton. */
body.stop-page main > .illu{ flex:1 1 auto; }
body.stop-page main > .play-main{ flex:0 0 auto; }

.crumb{
  display:flex;justify-content:space-between;align-items:baseline;
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
  padding-top:calc(var(--lh)*.5);
  flex:0 0 auto;
}
.illu{
  margin-top:var(--lh);
  width:100%;
  aspect-ratio:2/3;         /* même ratio que les affiches → jamais de bord visible */
  max-height:100%;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  flex:0 1 auto;
  min-height:0;
  margin-left:auto;margin-right:auto;
}
.illu img{width:100%;height:100%;object-fit:cover;display:block}
.illu .ph{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}

/* le bouton, le transcript et le pied de page ne rétrécissent jamais */
.play-main, .acc, .foot{ flex:0 0 auto; }

h2.title{
  font-family:var(--black);font-weight:400;
  font-size:clamp(38px,11vw,50px);line-height:1;
  margin-top:calc(var(--lh)*1.25);
}
.meta{margin-top:12px;font-size:12px;color:var(--dim);display:flex;gap:18px;flex-wrap:wrap}
.desc{margin-top:var(--lh);font-size:15px;line-height:1.55}

/* bouton principal — devient lui-même le lecteur une fois lancé */
.play-main{
  margin-top:calc(var(--lh)*1.25);
  width:100%;
  background:var(--ink);color:var(--bg);
  border-radius:32px;padding:18px 26px;min-height:72px;
  transition:transform .25s cubic-bezier(.2,.7,.2,1), border-radius .25s ease;
  display:flex;flex-direction:column;justify-content:center;gap:10px;
}
.play-main:active{transform:scale(.985)}
.play-main__row{display:flex;align-items:center;justify-content:space-between;gap:16px}
.play-main__t{font-family:var(--black);font-size:28px;line-height:1}
.play-main__ic{width:22px;height:22px;flex:0 0 auto}
.play-main__ic svg{width:100%;height:100%;display:block}
.play-main__ic svg path{fill:var(--bg)}

.play-main__bar{
  height:2px;background:rgba(255,255,255,.25);border-radius:2px;position:relative;cursor:pointer;
  display:none;
}
.play-main.on .play-main__bar{display:block}
.play-main__bar i{position:absolute;inset:0 auto 0 0;width:0%;background:var(--bg);border-radius:2px}
.play-main__time{
  display:none;
  justify-content:space-between;font-size:11px;opacity:.6;
}
.play-main.on .play-main__time{display:flex}

.hint{margin-top:14px;font-size:11px;color:var(--dim);line-height:1.5;display:flex;gap:8px;align-items:flex-start}

/* transcript */
.acc{margin-top:calc(var(--lh)*1.5);border-top:1px solid var(--faint);padding-top:16px}
.acc__btn{display:flex;justify-content:space-between;align-items:center;width:100%;
  font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.acc__body{display:none;margin-top:16px;font-size:14px;line-height:1.7}
.acc__body.on{display:block}
.acc__body p{margin-bottom:14px}

/* suite */
.next{margin-top:calc(var(--lh)*2)}
.next a{display:flex;justify-content:space-between;align-items:center;
  border:1.5px solid var(--ink);border-radius:999px;padding:14px 22px;min-height:60px}
.next__k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:4px}
.next__t{font-family:var(--black);font-size:22px;line-height:1}
.next__a{font-size:18px}

/* ---------- à propos ---------- */
h2.big{font-family:var(--black);font-weight:400;font-size:44px;line-height:1;padding-top:calc(var(--lh)*.5)}
.about p{margin-top:var(--lh);font-size:15px;line-height:1.6}
.credits{margin-top:calc(var(--lh)*1.5);display:flex;flex-direction:column;gap:18px}
.credits div{display:flex;flex-direction:column;gap:4px}
.credits .k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.credits .v{font-size:15px}

/* ---------- footer ---------- */
.foot{margin-top:calc(var(--lh)*2.5);padding-top:20px;border-top:1px solid var(--faint);
  display:flex;justify-content:space-between;font-size:11px;color:var(--dim);letter-spacing:.06em}

/* ---------- lecteur ---------- */
.player{
  position:fixed;left:50%;bottom:12px;z-index:40;
  width:calc(100% - 24px);max-width:496px;
  transform:translateX(-50%) translateY(160%);
  background:var(--ink);color:var(--bg);border-radius:999px;
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;
  padding:10px 16px 10px 10px;
  transition:transform .45s cubic-bezier(.2,.8,.2,1);
}
.player.on{transform:translateX(-50%) translateY(0)}
.pbtn{width:52px;height:52px;border-radius:50%;background:var(--bg);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.pbtn svg{width:15px;height:15px}
.pbtn svg path{fill:var(--ink)}
.pmid{min-width:0}
.ptitle{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar{height:2px;background:rgba(255,255,255,.25);margin-top:8px;border-radius:2px;position:relative;cursor:pointer}
.pbar i{position:absolute;inset:0 auto 0 0;width:0%;background:var(--bg);border-radius:2px}
.ptime{font-size:11px;opacity:.6;margin-top:6px;display:flex;justify-content:space-between}
.pskip{display:flex;gap:6px;flex:0 0 auto}
.pskip button{width:38px;height:38px;border-radius:50%;
  border:1px solid rgba(255,255,255,.3);font-size:9px;color:var(--bg);
  display:flex;align-items:center;justify-content:center}

</style>
</head>
<body class="stop-page">

<header>
  <a class="brand" href="index.html">balade sonore</a>
</header>

<main>
  <div class="illu">
    <img src="img/image_donjon.png" alt="Le donjon">
  </div>

  <button class="play-main" id="s-play">
    <span class="play-main__row">
      <span class="play-main__t" id="s-playlabel">Le donjon</span>
      <span class="play-main__ic" id="s-playicon"><svg viewBox="0 0 12 14"><path d="M0 0l12 7-12 7z"/></svg></span>
    </span>
    <span class="play-main__bar" id="p-bar"><i id="p-fill"></i></span>
    <span class="play-main__time"><span id="p-cur">0:00</span><span id="p-dur">08:05</span></span>
  </button>
</main>

<audio id="audio" preload="metadata" playsinline></audio>

<script>
window.STOP = {
  title: "Le donjon",
  dur:   "08:05",
  src:   "audio/donjon.mp3",
  illu:  "img/image_donjon.png"
};

/* Lecteur commun — piloté par window.STOP défini avant ce script.
   Le bouton principal (#s-play) EST le lecteur : au premier clic il
   se transforme sur place (barre de progression + temps), sans bloc
   flottant séparé. Pas de boutons d'avance/retour : on écoute dans
   l'ordre, du début à la fin. */
(function () {
  var STOP = window.STOP;
  if (!STOP) return;

  var audio   = document.getElementById('audio');
  var mainBtn = document.getElementById('s-play');
  var mainIc  = document.getElementById('s-playicon');
  var pBar    = document.getElementById('p-bar');
  var pFill   = document.getElementById('p-fill');
  var pCur    = document.getElementById('p-cur');
  var pDur    = document.getElementById('p-dur');

  var ICON_PLAY  = '<path d="M0 0l12 7-12 7z"/>';
  var ICON_PAUSE = '<path d="M0 0h4v14H0zM8 0h4v14H8z"/>';

  var demoTimer = null, demoT = 0, demoLen = 300;

  function durToSec(d){ var p = String(d).split(':'); return (+p[0]) * 60 + (+p[1] || 0); }
  function fmt(s){
    if (!isFinite(s) || s < 0) s = 0;
    var m = Math.floor(s / 60), x = Math.floor(s % 60);
    return m + ':' + String(x).padStart(2, '0');
  }

  /* ---------- init ---------- */
  audio.src = STOP.src;
  pDur.textContent = STOP.dur;
  demoLen = durToSec(STOP.dur);

  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: STOP.title,
      artist: 'Balade sonore — Crouy-sur-Ourcq',
      album: 'Médiévales du Houssoy 2026',
      artwork: STOP.illu ? [{ src: STOP.illu, sizes: '512x512', type: 'image/png' }] : []
    });
    navigator.mediaSession.setActionHandler('play',  play);
    navigator.mediaSession.setActionHandler('pause', pause);
  }

  /* ---------- lecture ---------- */
  function play(){
    mainBtn.classList.add('on');
    var p = audio.play();
    if (p && p.catch) p.catch(startDemo);   // fichier absent → démo
  }
  function pause(){
    audio.pause();
    if (demoTimer) { clearInterval(demoTimer); demoTimer = null; }
    icon(false);
  }
  function toggle(){
    if (audio.paused && !demoTimer) play(); else pause();
  }
  function startDemo(){
    clearInterval(demoTimer);
    demoTimer = setInterval(function(){
      demoT += 0.25;
      if (demoT >= demoLen) { demoT = 0; pause(); return; }
      paint(demoT, demoLen);
    }, 250);
    icon(true);
  }
  function paint(cur, dur){
    pFill.style.width = (dur ? cur / dur * 100 : 0) + '%';
    pCur.textContent = fmt(cur);
    pDur.textContent = fmt(dur);
  }
  function icon(on){
    mainIc.querySelector('svg').innerHTML = on ? ICON_PAUSE : ICON_PLAY;
  }

  audio.addEventListener('play',  function(){ if (demoTimer){clearInterval(demoTimer);demoTimer=null;} icon(true); });
  audio.addEventListener('pause', function(){ if (!demoTimer) icon(false); });
  audio.addEventListener('ended', function(){ icon(false); });
  audio.addEventListener('timeupdate', function(){
    if (!demoTimer) paint(audio.currentTime, audio.duration || demoLen);
  });

  mainBtn.addEventListener('click', function(e){
    /* un clic sur la barre sert à naviguer dans le son, pas à le mettre en pause */
    if (e.target === pBar || pBar.contains(e.target)) return;
    toggle();
  });
  pBar.addEventListener('click', function(e){
    e.stopPropagation();
    var r = pBar.getBoundingClientRect(), ratio = (e.clientX - r.left) / r.width;
    if (demoTimer) { demoT = ratio * demoLen; paint(demoT, demoLen); }
    else if (audio.duration) audio.currentTime = ratio * audio.duration;
  });
})();

</script>
</body>
</html>
